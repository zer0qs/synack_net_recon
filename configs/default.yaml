# netrecon default configuration.
#
# Every value here is validated on load. Rate limits are additionally clamped
# in code (netrecon/core/config.py): a value above the hard maximum is reduced
# and logged, it is never honoured.

run_name: default
output_dir: results

limits:
  # Packets per second for the fast sweep (masscan / naabu / nmap --max-rate).
  # Hard maximum enforced in code: 20000. Anything above 1000 prints a warning
  # in the pre-flight summary.
  masscan_rate: 1000
  # Requests per second for the optional nuclei stage. Hard maximum: 300.
  nuclei_rate: 50
  # Worker threads for per-host nmap runs. Hard maximum: 64.
  concurrency: 8
  # nmap -T template (0 paranoid .. 5 insane). 3 is the polite default.
  nmap_timing: 3
  # Per-host nmap budget.
  host_timeout_seconds: 900
  # Whole-stage budget for the sweep and discovery tools.
  stage_timeout_seconds: 7200

stages:
  discovery: true
  sweep: true
  services: true
  # OS detection needs raw sockets; silently skipped when unprivileged.
  os_detect: false
  # Safe NSE scripts. Also reachable with --scripts.
  scripts: false
  # nuclei network templates. Requires --active in addition to this flag.
  nuclei: false
  # Read-only web recon + JavaScript analysis. Requires --web.
  webrecon: false
  # Per-service deep analysis of evidence already collected. Sends no
  # packets; also reachable with --service-recon.
  servicerecon: false

scope:
  # Refuse to start if the scope file expands beyond this many addresses.
  max_hosts: 65536
  # Include network and broadcast addresses of prefixes wider than /31.
  include_network_broadcast: false

ports:
  # Curated TCP set used by the fast sweep.
  sweep: >-
    21-23,25,53,80,81,88,110,111,135,139,143,161,389,443,445,465,514,515,587,
    631,636,873,993,995,1025,1080,1099,1433,1521,1723,1883,2049,2181,2375,2376,
    3000,3128,3306,3389,4443,4786,5000,5060,5432,5601,5672,5900,5985,5986,6000,
    6379,7001,8000-8010,8080-8090,8443,8888,9000,9042,9090,9100,9200,9300,
    10000,11211,15672,27017,27018,50000
  # Used when --full-ports is passed.
  sweep_full: 1-65535
  # Deliberately small UDP set (UDP scanning is slow and easy to overdo).
  udp: 53,67,123,137,161,500,1900,5353

discovery:
  # auto  : fping when raw sockets are available, otherwise nmap -sn
  # fping : require fping
  # nmap  : require nmap -sn
  # skip  : treat every in-scope address as live (same as --skip-discovery)
  method: auto
  fping_retries: 2
  fping_timeout_ms: 500
  # Continue against the whole scope if nothing answers discovery. Off by
  # default: a silent network usually means filtered ICMP, and blindly port
  # scanning everything is a decision the operator should make explicitly.
  assume_live_on_empty: false

sweep:
  # auto | masscan | naabu | nmap
  backend: auto
  udp: false
  retries: 1

services:
  # nmap --version-intensity (0..9).
  version_intensity: 5
  # Adds the safe NSE 'banner' script to the -sV run.
  banner_grab: false

scripts:
  # Only 'default', 'discovery', 'safe' and 'version' are accepted. The
  # categories intrusive, brute, dos, exploit, malware, vuln, fuzzer, external,
  # broadcast and auth are rejected and can never be enabled.
  categories:
    - default
    - discovery

nuclei:
  templates:
    - network/
  # info findings are noise in a network sweep; drop them by default.
  severity: low,medium,high,critical
  # Hard maximum: 50. Rate limit comes from limits.nuclei_rate (hard max 300).
  concurrency: 10
  timeout_seconds: 10
  # Tags fuzz, fuzzing, intrusive, dos and brute-force are ALWAYS excluded in
  # code. Anything listed here is added to that set; it cannot shorten it.
  exclude_tags: []

webrecon:
  # Read-only web reconnaissance. This stage issues HTTP GET requests only:
  # no form submission, no authentication, no redirect following and no path
  # brute forcing. The only paths requested are '/', robots.txt, sitemap.xml
  # and script URLs the page itself links, on the same in-scope endpoint.
  #
  # Endpoints probed per run.
  max_endpoints: 100
  # Scripts analysed per endpoint (inline scripts count toward this).
  max_scripts_per_endpoint: 25
  # Bytes read from any single response. Hard maximum: 16777216 (16 MiB).
  max_response_bytes: 2097152
  # Requests per second across all workers. Hard maximum: 50; warns above 10.
  rate_per_second: 5.0
  request_timeout_seconds: 10
  concurrency: 4
  # Verify TLS certificates. Off by default: in-scope hosts routinely present
  # self-signed or expired certificates, and failing closed would hide the
  # service entirely. Certificate problems are reported, not fatal.
  verify_tls: false
  # Mask credential-looking strings found in JavaScript. The full value stays
  # in the saved response body under webrecon/ for manual verification.
  # Turning this off writes candidate secrets into the report in full.
  redact_secrets: true
  user_agent: netrecon/1.2 (authorised security assessment)

  # Probe a short curated list of commonly exposed files (.git/HEAD, .env,
  # backups, Actuator endpoints...). This IS path probing: it generates 404s in
  # the target's access log. Off unless --hidden-paths is passed. Hard maximum
  # on the list length: 400 - this must not become a brute-force wordlist.
  hidden_paths: false
  max_hidden_paths: 120
  # Also request paths the site itself publishes in robots.txt and sitemap.xml.
  # Not guessing: the site advertised them. On by default.
  follow_published_paths: true
  # Fetch .map files referenced by scripts. Source maps carry the original
  # unminified sources and are usually the richest single artifact.
  fetch_source_maps: true
  # Follow further .js references found inside fetched scripts, so bundles that
  # lazy-load chunks are covered. Same in-scope endpoint only, and still bounded
  # by max_scripts_per_endpoint.
  crawl_scripts: true
  # Try both http:// and https:// on each open web port instead of guessing a
  # scheme from the port number. The wrong scheme fails fast.
  probe_both_schemes: true
  # Report personal data found in front-end assets. Counts and kinds are the
  # finding; sample values are masked. Turning this off omits the section.
  detect_pii: true
  # Local NVD/CVE JSON feed used to correlate detected versions. Empty means no
  # correlation. netrecon NEVER downloads a feed - point this at a file you
  # fetched yourself. Matches are correlations, not verified vulnerabilities.
  cve_feed: ""

servicerecon:
  # Per-service deep analysis. Pure offline analysis of the nmap -sV and NSE
  # output the earlier stages already collected, so it is cheap and repeatable.
  #
  # Analyzers to run. Omit or leave empty for all of them:
  #   tls smb database ssh snmp dns mail http
  analyzers:
  # The TLS analyzer may open one connection per endpoint when no ssl-cert NSE
  # output exists. This is the only network access this stage can make.
  allow_tls_probe: true
  probe_timeout_seconds: 10
